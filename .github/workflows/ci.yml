name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend lint + test + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bid
          POSTGRES_PASSWORD: bid
          POSTGRES_DB: bid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bid"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      BID_DATABASE_URL: postgresql+psycopg://bid:bid@localhost:5432/bid_test
      BID_REDIS_URL: redis://localhost:6379/0
      BID_LLM_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend deps
        run: |
          pip install -r backend/requirements-dev.txt
          pip install -r backend/requirements.txt
      - name: Lint (ruff)
        run: |
          cd backend && ruff check .
          cd backend && ruff format --check .
      - name: Type check (mypy)
        run: cd backend && mypy app
      - name: Unit + service + API tests (coverage ≥ 70%)
        run: |
          cd backend && alembic upgrade head
          cd backend && pytest tests --cov=app --cov-report=term-missing --cov-fail-under=70 -q
      - name: Key modules coverage ≥ 80% (agents / proposal / infra)
        run: |
          cd backend && pytest tests \
            --cov=app.agents --cov=app.services.proposal --cov=app.services.infra \
            --cov-report=term-missing --cov-fail-under=80 -q

  frontend-checks:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Unit tests (vitest)
        run: cd frontend && pnpm test
      - name: Lint
        run: cd frontend && pnpm lint
      - name: Build
        run: cd frontend && pnpm build

  security:
    name: Security scan (gitleaks + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Frontend dependency audit
        run: |
          cd frontend && pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit --audit-level high

  e2e:
    name: E2E full-chain (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks, security]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install e2e deps
        run: cd e2e && pnpm install --frozen-lockfile
      - name: Start full stack
        run: docker compose -f deploy/docker-compose.yml up -d --wait
      - name: Run Playwright
        run: |
          cd e2e && npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
        retention-days: 14
