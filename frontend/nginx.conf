server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 上传大小限制（对齐后端 max_upload_size_mb=50）
    client_max_body_size 50m;

    location / {
        try_files $uri $uri/ /index.html;
        # 入口 HTML 禁用缓存：每次发版资源 hash 变化，浏览器必须拉新 index.html，
        # 否则启发式缓存（ETag/Last-Modified）会让用户停留在旧 bundle
        add_header Cache-Control "no-cache";
    }

    # 带 hash 的静态资源：长期强缓存（文件名即版本）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Docker 内嵌 DNS：api 容器重建（IP 漂移）后自动重新解析，避免 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
