services:
  # ── PostgreSQL + pgvector ──
  postgres:
    image: docker.1ms.run/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bid
      POSTGRES_PASSWORD: bid
      POSTGRES_DB: bid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bid"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ──
  redis:
    image: docker.1ms.run/redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MinIO ──
  minio:
    image: docker.1ms.run/minio/minio:RELEASE.2024-02-26T09-33-48Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── 后端 API ──
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      BID_DATABASE_URL: postgresql+psycopg://bid:bid@postgres:5432/bid
      BID_REDIS_URL: redis://redis:6379/0
      BID_MINIO_ENDPOINT: minio:9000
      # Browser-reachable public endpoint (presigned URL host rewrite)
      BID_MINIO_PUBLIC_ENDPOINT: localhost:9000
      BID_DEBUG: "true"
      BID_LLM_MOCK: "false"
      # CORS allowed origins (JSON array format for Pydantic list parser)
      BID_CORS_ORIGINS: '["http://localhost:5173"]'
      # Embedding model (litellm provider prefix required)
      BID_EMBEDDING_MODEL: "dashscope/text-embedding-v3"
      # Admin accounts (comma-separated user emails)
      BID_ADMIN_USER_IDS: "admin@bidagent.com"
      # ── LLM API Keys（LiteLLM 标准环境变量回退）──
      # deepseek/* 模型自动读取 DEEPSEEK_API_KEY
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      # dashscope/* 模型 + embedding 自动读取 DASHSCOPE_API_KEY
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Arq Worker ──
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: arq worker.WorkerSettings
    environment:
      BID_DATABASE_URL: postgresql+psycopg://bid:bid@postgres:5432/bid
      BID_REDIS_URL: redis://redis:6379/0
      BID_MINIO_ENDPOINT: minio:9000
      BID_MINIO_PUBLIC_ENDPOINT: localhost:9000
      BID_DEBUG: "true"
      BID_LLM_MOCK: "false"
      BID_EMBEDDING_MODEL: "dashscope/text-embedding-v3"
      BID_ADMIN_USER_IDS: "admin@bidagent.com"
      BID_CORS_ORIGINS: '["http://localhost:5173"]'
      # ── LLM API Keys（与 api 一致）──
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── 前端 ──
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
