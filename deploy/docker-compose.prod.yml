# ── 生产/演示环境部署（目标服务器 192.168.18.200，1Panel v1.10.31-lts）──
# 与本地开发 docker-compose.yml 的差异（2026-08-31 部署评估后定制）：
# 1. 端口重映射：服务器已占用 6379(autoconvert_redis)、9000/9090(autoconvert_minio)、
#    8000(流量网关 FastAPI)；5432/8000 等改用高位端口
# 2. 去掉源码挂载与 --reload（镜像内代码运行），BID_DEBUG=false
# 3. 注入 BID_JWT_SECRET / BID_MINIO_SECRET_KEY（生产模式默认密钥会拒绝启动，
#    见 backend/app/core/config.py::validate_runtime_secrets）
# 4. BID_MINIO_PUBLIC_ENDPOINT / BID_CORS_ORIGINS 指向服务器地址
# 5. 全部服务 restart: unless-stopped
#
# 用法：docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build

services:
  # ── PostgreSQL + pgvector ──
  postgres:
    image: docker.1ms.run/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bid
      POSTGRES_PASSWORD: bid
      POSTGRES_DB: bid
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bid"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ──
  redis:
    image: docker.1ms.run/redis:7-alpine
    ports:
      - "16379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MinIO ──
  minio:
    image: docker.1ms.run/minio/minio:RELEASE.2024-02-26T09-33-48Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BID_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BID_MINIO_SECRET_KEY}
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── 后端 API ──
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      BID_DATABASE_URL: postgresql+psycopg://bid:bid@postgres:5432/bid
      BID_REDIS_URL: redis://redis:6379/0
      BID_MINIO_ENDPOINT: minio:9000
      # 浏览器可达的公共端点（presigned URL host 重写）
      BID_MINIO_PUBLIC_ENDPOINT: 192.168.18.200:19000
      BID_MINIO_ACCESS_KEY: ${BID_MINIO_ACCESS_KEY}
      BID_MINIO_SECRET_KEY: ${BID_MINIO_SECRET_KEY}
      BID_DEBUG: "false"
      BID_LLM_MOCK: "false"
      # 生产 JWT 签名密钥（.env.prod 注入，默认值会拒绝启动）
      BID_JWT_SECRET: ${BID_JWT_SECRET}
      # CORS 允许的前端来源
      BID_CORS_ORIGINS: '["http://192.168.18.200:5173"]'
      # Embedding 模型（litellm provider 前缀必须）
      BID_EMBEDDING_MODEL: "dashscope/text-embedding-v3"
      # 管理员账号（注册该邮箱即获得管理权限）
      BID_ADMIN_USER_IDS: "admin@bidagent.com"
      # ── LLM API Keys（LiteLLM 标准环境变量回退）──
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
    ports:
      - "18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── Arq Worker ──
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: arq worker.WorkerSettings
    environment:
      BID_DATABASE_URL: postgresql+psycopg://bid:bid@postgres:5432/bid
      BID_REDIS_URL: redis://redis:6379/0
      BID_MINIO_ENDPOINT: minio:9000
      BID_MINIO_PUBLIC_ENDPOINT: 192.168.18.200:19000
      BID_MINIO_ACCESS_KEY: ${BID_MINIO_ACCESS_KEY}
      BID_MINIO_SECRET_KEY: ${BID_MINIO_SECRET_KEY}
      BID_DEBUG: "false"
      BID_LLM_MOCK: "false"
      BID_JWT_SECRET: ${BID_JWT_SECRET}
      BID_EMBEDDING_MODEL: "dashscope/text-embedding-v3"
      BID_ADMIN_USER_IDS: "admin@bidagent.com"
      BID_CORS_ORIGINS: '["http://192.168.18.200:5173"]'
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── 前端 ──
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
